name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every day at 6:17am Pacific (13:17 UTC; 14:17 UTC once DST ends — close enough).
    - cron: '17 13 * * *'
    # Late Sunday and Monday nights, after the last games finish.
    - cron: '47 6 * * 1,2'
  workflow_dispatch:
    inputs:
      force_stories:
        description: Rewrite every storyline
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Refresh NFL data
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ "${{ inputs.force_stories }}" = "true" ]; then
            npm run data:nfl -- --force-stories
          else
            npm run data:nfl
          fi

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "state-of-the-league bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data pipeline/cache/nfl-storylines.json
          git diff --cached --quiet || git commit -m "Update NFL data"
          git push

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
